[project]
name = "pokebot"
version = "0.1.0"
description = "Pokémon TCG Sales Recorder Telegram Bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot==21.6",
    "asyncpg==0.30.0",
    "sqlalchemy==2.0.34",
    "alembic==1.13.2",
    "openai==1.52.2",
    "gspread==6.1.3",
    "google-auth==2.35.0",
    "google-auth-oauthlib==1.2.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "tenacity==8.5.0",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "ruff==0.7.1",
    "mypy==1.11.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]