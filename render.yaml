services:
  - type: web
    name: pokebot
    env: python
    plan: free

    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: python3 run_bot.py
    port: 10000

    envVars:
      - key: TELEGRAM_BOT_TOKEN
        fromSecret: TELEGRAM_BOT_TOKEN
      - key: DATABASE_URL
        fromDatabase:
          name: pokebot-db
          property: connectionString
      - key: OPENAI_API_KEY
        fromSecret: OPENAI_API_KEY
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        fromSecret: GOOGLE_SERVICE_ACCOUNT_JSON
      - key: GOOGLE_SHEET_ID
        fromSecret: GOOGLE_SHEET_ID
      - key: ALLOWED_USER_IDS
        fromSecret: ALLOWED_USER_IDS