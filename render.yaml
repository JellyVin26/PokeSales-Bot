# Render.com deployment config for PokéSales Bot (Python)

services:
  - type: web
    name: pokebot
    env: python
    plan: free

    # Build: install Python deps
    buildCommand: pip install -r requirements.txt

    # Start: run the Telegram bot (polling, keeps process alive)
    startCommand: python run_bot.py

    # Health check — Render expects HTTP for web services
    # Since bot uses polling, we add a simple health endpoint
    healthCheckPath: /health

    # Disk for database persistence
    disk:
      name: pokebot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

    envVars:
      - key: TELEGRAM_BOT_TOKEN
        fromSecret: TELEGRAM_BOT_TOKEN
      - key: DATABASE_URL
        fromDatabase:
          name: pokebot-db
          property: connectionString
      - key: OPENAI_API_KEY
        fromSecret: OPENAI_API_KEY
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        fromSecret: GOOGLE_SERVICE_ACCOUNT_JSON
      - key: GOOGLE_SHEET_ID
        fromSecret: GOOGLE_SHEET_ID
      - key: ALLOWED_USER_IDS
        fromSecret: ALLOWED_USER_IDS